<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fb" />
  <title>Tiny Painting Helper</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="title-row">
        <h1>Tiny Painting Helper</h1>
        <button id="helpBtn" class="help-btn" type="button" aria-label="Open help">?</button>
        <button id="cookbookBtn" class="cookbook-btn" type="button" aria-label="Open cookbook">Cookbook</button>
      </div>
    </header>

    <section class="card">
      <div class="top-bar">
        <details id="settingsPanel" class="settings-panel">
          <summary>
            <span>Options</span>
            <span id="settingsSummary" class="settings-summary">Fixed ratio set</span>
          </summary>

          <div class="controls">
            <label><input id="timeMode" type="checkbox" /> Timed mode (10s)</label>
            <label><input id="randomMode" type="checkbox" /> Random float ratio mode</label>
            <label><input id="areaScaleMode" type="checkbox" /> Random scale (0.3–4.0)</label>
            <label><input id="polygonMode" type="checkbox" /> Impossible mode</label>
            <label><input id="lineMode" type="checkbox" /> Line mode</label>
            <label class="draw-option"><input id="drawMode" type="checkbox" /> Draw target ratio mode</label>
          </div>
        </details>

        <div class="difficulty-panel" aria-label="Difficulty">
          <label for="difficultySelect">Difficulty</label>
          <select id="difficultySelect">
            <option value="easy">easy</option>
            <option value="medium" selected>medium</option>
            <option value="hard">hard</option>
          </select>
        </div>

        <div class="info">
          <div id="modeLabel" hidden></div>
          <div id="timerLabel"></div>
          <div id="scoreLabel"></div>
        </div>
      </div>

      <div class="canvas-frame">
        <canvas id="shapeCanvas" width="760" height="460"></canvas>
      </div>

      <div id="questionLabel" class="question"></div>

      <div id="options" class="options">
        <button class="option"></button>
        <button class="option"></button>
        <button class="option"></button>
        <button class="option"></button>
      </div>

      <div class="bottom-bar">
        <div id="feedbackLabel" class="feedback"></div>
        <div class="nav">
          <button id="prevBtn" class="nav-btn">Previous</button>
          <button id="nextBtn" class="nav-btn">Next</button>
        </div>
      </div>
    </section>
  </main>

  <div id="cookbookModal" class="help-modal" hidden>
    <div class="help-backdrop" data-close-cookbook></div>
    <section class="help-dialog tutorial-dialog" role="dialog" aria-modal="true" aria-labelledby="cookbookTitle">
      <div class="help-dialog-header">
        <h2 id="cookbookTitle">Tiny Painting Helper Cookbook</h2>
        <button id="cookbookCloseBtn" class="help-close-btn" type="button" aria-label="Close cookbook">×</button>
      </div>
      <iframe id="cookbookFrame" class="help-frame" title="Tiny Painting Helper Cookbook" src="about:blank"></iframe>
    </section>
  </div>


  <div id="helpModal" class="help-modal" hidden>
    <div class="help-backdrop" data-close-help></div>
    <section class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <div class="help-dialog-header">
        <h2 id="helpTitle">Tiny Painting Helper Guide</h2>
        <button id="helpCloseBtn" class="help-close-btn" type="button" aria-label="Close help">×</button>
      </div>
      <iframe id="helpFrame" class="help-frame" title="Tiny Painting Helper Guide" src="about:blank"></iframe>
    </section>
  </div>
  <script src="./app.js"></script>
</body>
</html>
